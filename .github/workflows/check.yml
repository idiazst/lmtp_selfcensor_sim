name: Simulation source and design checks
on:
  push:
    branches: [main]
    paths: ['studies/**', 'scripts/**', 'dependencies/**', '.github/workflows/check.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install pinned dependencies
        run: Rscript scripts/install_dependencies.R
      - name: Parse all current R sources
        shell: Rscript {0}
        run: |
          paths <- list.files(c("studies", "scripts"), pattern = "[.]R$", recursive = TRUE, full.names = TRUE)
          invisible(lapply(paths, parse))
      - name: Verify DGP and exact truths
        run: Rscript scripts/check_setup.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-design-checks
          path: results/longitudinal/design-checks/
